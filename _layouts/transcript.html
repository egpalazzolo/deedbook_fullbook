<!DOCTYPE html> 
<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>{{ page.title | default: site.title }}</title> <style> body { margin: 0; padding: 0; background: #ffffff; color: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; } .page-container { width: 95%; max-width: 1600px; margin: 0 auto; padding: 30px 0; } h1 { margin-top: 0; margin-bottom: 25px; font-size: 2rem; } /* * Markdown tables */ table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 20px 0; font-size: 14px; } th, td { border: 1px solid #d0d7de; padding: 10px 12px; text-align: left; vertical-align: top; /* * Make long names and descriptions wrap * instead of creating horizontal scrolling. */ white-space: normal; overflow-wrap: anywhere; word-break: normal; } th { background-color: #f6f8fa; font-weight: 600; } tr:nth-child(even) { background-color: #f6f8fa; } tr:hover { background-color: #ddf4ff; } /* * Column widths */ th:nth-child(1), td:nth-child(1) { width: 8%; } th:nth-child(2), td:nth-child(2) { width: 10%; } th:nth-child(3), td:nth-child(3) { width: 52%; } th:nth-child(4), td:nth-child(4) { width: 30%; } /* * Mobile screens */ @media screen and (max-width: 700px) { .page-container { width: 96%; padding: 20px 0; } h1 { font-size: 1.5rem; } table { font-size: 12px; } th, td { padding: 7px; } } </style> </head> <body> <main class="page-container">
{% if page.title %}
  <h1>{{ page.title }}</h1>
{% endif %}

{{ content }}

</main> </body> </html>
