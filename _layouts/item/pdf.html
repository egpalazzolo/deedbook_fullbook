---
# basic layout for PDF documents
# Displays image_small if available, with fall back to image_thumb, or a pdf icon.
layout: item/item-page-base
---

<div class="card mb-4 text-center">
    <div class="card-body">


        <div class="mt-2">

            {% include item/download-buttons.html %}

        </div>
        <div class="my-4 text-center">
    <!-- Full-screen PDF Embedder -->
    <object data="{{ '/objects/' | relative_url | append: page.filename }}" type="application/pdf" width="100%" height="800px">
        <p>Your browser does not support embedded PDFs. 
           <a href="{{ '/objects/' | relative_url | append: page.filename }}" class="btn btn-primary" target="_blank" rel="noopener">
               Download the PDF file directly
           </a>.
        </p>
    </object>
</div>


    </div>
</div>
