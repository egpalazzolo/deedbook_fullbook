---
layout: item/item-page-base
---

<!-- Full-Width Stacked Media Area -->
<div class="w-100">
  
  <!-- 1. PDF Viewer Card -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header bg-light d-flex justify-content-between align-items-center py-2">
      <h6 class="m-0 font-weight-bold text-dark">Archival Resource</h6>
      <a href="{{ page.object_location | relative_url }}" class="btn btn-sm btn-primary" download>
        <svg class="bi icon-sprite" role="img" aria-label="Download PDF" width="16" height="16"><use xlink:href="{{ '/assets/lib/cb-icons.svg' | relative_url }}#icon-download"/></svg> Download PDF
      </a>
    </div>
    <div class="card-body p-0" style="height: 600px;">
      <object data="{{ page.object_location | relative_url }}" type="application/pdf" width="100%" height="100%">
        <div class="p-4 text-center">
          <p>Your browser does not support inline PDFs.</p>
          <a href="{{ page.object_location | relative_url }}" class="btn btn-outline-primary" download>Download PDF to View</a>
        </div>
      </object>
    </div>
  </div>

  <!-- 2. CSV Table Card -->
  <div class="card mb-4 shadow-sm">
    <div class="card-header bg-light d-flex justify-content-between align-items-center py-2">
      <h6 class="m-0 font-weight-bold text-dark">Book Contents</h6>
      <a href="{{ page.object_transcript | relative_url }}" class="btn btn-sm btn-outline-primary" download>
         Download Book Contents (CSV)
      </a>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive" style="max-height: 450px; overflow-y: auto;">
        <table id="csv-data-table" class="table table-striped table-hover table-bordered m-0" style="font-size: 0.85rem;">
          <thead class="table-dark sticky-top" id="csv-table-head">
            <tr><th class="p-3 text-muted">Waiting for data...</th></tr>
          </thead>
          <tbody id="csv-table-body">
            <tr><td class="p-3">Initializing parser...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- Bulletproof JavaScript Subdirectory CSV Parser -->
<script>
function parseCsv(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const character = text[i];

    if (character === '"') {
      if (inQuotes && text[i + 1] === '"') {
        field += '"';
        i++;
      } else if (inQuotes) {
        inQuotes = !inQuotes;
      } else if (field === "") {
        inQuotes = true;
      } else {
        field += character;
      }
    } else if (character === "," && !inQuotes) {
      row.push(field);
      field = "";
    } else if ((character === "\n" || character === "\r") && !inQuotes) {
      row.push(field);
      rows.push(row);
      row = [];
      field = "";
      if (character === "\r" && text[i + 1] === "\n") i++;
    } else if (character === "\r" && inQuotes) {
      field += "\n";
      if (text[i + 1] === "\n") i++;
    } else {
      field += character;
    }
  }

  if (inQuotes) {
    throw new Error("CSV contains an unterminated quoted field.");
  }

  if (field !== "" || row.length > 0) {
    row.push(field);
    rows.push(row);
  }

  return rows;
}

document.addEventListener("DOMContentLoaded", function() {
  // Added a cache-busting timestamp tag to the URL string
  const baseCsvUrl = "{{ page.object_transcript | relative_url }}";
  const csvUrl = baseCsvUrl + "?cb=" + new Date().getTime();
  
  const headEl = document.getElementById("csv-table-head");
  const bodyEl = document.getElementById("csv-table-body");
  
  if (!baseCsvUrl || baseCsvUrl === "" || baseCsvUrl === "/") {
    bodyEl.innerHTML = '<tr><td class="p-3 text-warning">No CSV file path provided in your item metadata fields.</td></tr>';
    return;
  }

  fetch(csvUrl)
    .then(response => {
      if (!response.ok) {
        throw new Error(`Server returned status ${response.status}. Double check that your file is physically saved in the directory.`);
      }
      return response.text();
    })
    .then(text => {
      if (!text || text.trim() === "") {
        bodyEl.innerHTML = '<tr><td class="p-3 text-info">The target CSV file was reached but it contains no text content.</td></tr>';
        return;
      }

      const rows = parseCsv(text.replace(/^\uFEFF/, ""));
      const firstRowIndex = rows.findIndex(row => row.some(cell => cell.trim() !== ""));

      if (firstRowIndex === -1) {
        bodyEl.innerHTML = '<tr><td class="p-3 text-info">No rows found in this file.</td></tr>';
        return;
      }

      const headerRow = document.createElement("tr");
      rows[firstRowIndex].forEach(header => {
        const th = document.createElement("th");
        th.scope = "col";
        th.className = "py-2";
        th.textContent = header.trim();
        headerRow.appendChild(th);
      });
      headEl.replaceChildren(headerRow);

      bodyEl.replaceChildren();
      rows.slice(firstRowIndex + 1).forEach(cells => {
        if (cells.every(cell => cell.trim() === "")) return;

        const tableRow = document.createElement("tr");
        cells.forEach(cell => {
          const td = document.createElement("td");
          td.className = "py-1 px-2";
          td.textContent = cell.trim();
          tableRow.appendChild(td);
        });
        bodyEl.appendChild(tableRow);
      });
    })
    .catch(error => {
      console.error("CSV Parser Error:", error);
      headEl.innerHTML = '<tr><th class="table-danger text-danger">Connection Error</th></tr>';
      const errorCell = document.createElement("td");
      errorCell.className = "p-3 text-danger font-weight-bold";
      errorCell.append("Failed to load the spreadsheet component.");
      errorCell.appendChild(document.createElement("br"));
      const reason = document.createElement("span");
      reason.className = "text-secondary font-weight-normal";
      reason.textContent = `Reason: ${error.message}`;
      errorCell.appendChild(reason);
      errorCell.appendChild(document.createElement("br"));
      errorCell.appendChild(document.createElement("br"));
      const pathLabel = document.createElement("span");
      pathLabel.className = "text-dark font-weight-bold";
      pathLabel.textContent = "Target Path Checked: ";
      errorCell.appendChild(pathLabel);
      const path = document.createElement("code");
      path.className = "text-danger";
      path.textContent = csvUrl;
      errorCell.appendChild(path);
      const errorRow = document.createElement("tr");
      errorRow.appendChild(errorCell);
      bodyEl.replaceChildren(errorRow);
    });
});
</script>
